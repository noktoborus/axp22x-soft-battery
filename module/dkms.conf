# DKMS: builds the module for each kernel installed, from
# /usr/src/axp22x-soft-battery-<version> (a copy of module/).
PACKAGE_NAME="axp22x-soft-battery"
PACKAGE_VERSION="0.1.0"
BUILT_MODULE_NAME[0]="axp22x_soft_battery"
DEST_MODULE_LOCATION[0]="/updates/dkms"
MAKE[0]="make KDIR=${kernel_source_dir} modules"
CLEAN="make KDIR=${kernel_source_dir} clean"
AUTOINSTALL="yes"
